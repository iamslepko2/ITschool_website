<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дорожная карта разработки игры</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120 0%, #19233c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 3.5rem;
            padding: 3rem 2rem 2.5rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .top-nav a {
            color: #9bb1e0;
            text-decoration: none;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .top-nav a:hover {
            background: rgba(100, 150, 255, 0.15);
            border-color: rgba(130, 170, 255, 0.3);
            color: #d6e2ff;
        }

        .top-nav a.active {
            background: rgba(100, 150, 255, 0.2);
            border-color: #7f9cf5;
            color: #f0f4ff;
        }

        h1 {
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.03em;
            font-size: 2.2rem;
            color: #f0f4ff;
            margin-bottom: 3rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        h1 span {
            background: linear-gradient(135deg, #b7c9ff, #8aa4f8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            position: relative;
            padding-left: 1.5rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 1.5rem;
            bottom: 1.5rem;
            width: 3px;
            background: linear-gradient(to bottom, #7f9cf5, #3b5bd1, #7f9cf5);
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(79, 114, 255, 0.3);
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: 1.8rem;
            padding: 1rem 1.5rem 1rem 1.2rem;
            background: rgba(18, 28, 50, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
        }

        .step:hover {
            background: rgba(32, 48, 80, 0.7);
            border-color: rgba(130, 170, 255, 0.2);
            transform: scale(1.01) translateX(6px);
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.5);
        }

        .step-marker {
            flex-shrink: 0;
            width: 2.8rem;
            height: 2.8rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            background: radial-gradient(circle at 30% 30%, #6d8eff, #2a4bb0);
            box-shadow: 0 6px 16px rgba(50, 90, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: 0.2s;
            position: relative;
            z-index: 2;
        }

        .step:hover .step-marker {
            transform: scale(1.05);
            box-shadow: 0 0 0 4px rgba(100, 150, 255, 0.25);
        }

        .step-content {
            flex: 1;
            padding-top: 0.2rem;
        }

        .step-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #eef4ff;
            letter-spacing: -0.01em;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 0.8rem;
        }

        .step-icon {
            font-size: 1.7rem;
            margin-right: 0.1rem;
            opacity: 0.9;
        }

        .step-desc {
            margin-top: 0.35rem;
            color: #b6c8f0;
            font-weight: 300;
            font-size: 0.98rem;
            opacity: 0.85;
            line-height: 1.5;
            max-width: 90%;
        }

        .step-summary {
            margin-top: 0.7rem;
            padding: 0.6rem 1rem;
            background: rgba(60, 100, 200, 0.12);
            border-left: 3px solid #7f9cf5;
            border-radius: 0.8rem;
            color: #d6e2ff;
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.5;
            backdrop-filter: blur(2px);
            display: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        .step-summary.active {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(-6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .step::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.01));
            pointer-events: none;
            border-radius: 2rem;
        }

        .step:last-child .step-marker {
            background: radial-gradient(circle at 30% 30%, #f6b868, #d9822b);
            box-shadow: 0 6px 20px rgba(255, 170, 50, 0.4);
        }

        .step:last-child .step-title {
            color: #ffe8b0;
        }

        .footer-note {
            margin-top: 3rem;
            text-align: center;
            color: #5b72a3;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 1.8rem;
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .footer-note span {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.7;
        }

        .footer-note i {
            font-style: normal;
            background: #1e2c4a;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #9bb1e0;
        }

        @media (max-width: 600px) {
            .card {
                padding: 1.5rem 1rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.7rem;
                margin-bottom: 2rem;
            }
            .step {
                padding: 0.8rem 1rem;
                gap: 1rem;
                flex-wrap: wrap;
                border-radius: 1.5rem;
            }
            .step-marker {
                width: 2.4rem;
                height: 2.4rem;
                font-size: 1rem;
            }
            .step-title {
                font-size: 1.25rem;
            }
            .step-desc {
                max-width: 100%;
                font-size: 0.9rem;
            }
            .step-summary {
                font-size: 0.85rem;
                padding: 0.5rem 0.8rem;
            }
            .timeline {
                padding-left: 0.5rem;
            }
            .timeline::before {
                left: 0.2rem;
            }
            .footer-note {
                flex-direction: column;
                gap: 0.7rem;
            }
            .top-nav {
                justify-content: center;
            }
            .top-nav a {
                font-size: 0.85rem;
                padding: 0.3rem 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <nav class="top-nav">
            <a href="index.html" class="active">🚀 Дорожная карта</a>
            <a href="ideas.html">💡 Генератор идей</a>
            <a href="spec.html">📐 Спецификация</a>
        </nav>

        <h1>
            <span>🎮</span> Создаём игру <span>на JavaScript</span>
        </h1>

        <div class="timeline" id="timeline"></div>

        <div class="footer-note">
            <span>🚀 <i>кликни по этапу → узнай суть</i></span>
            <span>👾 <i>для летней ИТ школы Кострома</i></span>
        </div>
    </div>
    <script>
        (function() {
            const stages = [{
                    id: 1,
                    title: 'Выбор концепции игры',
                    icon: '💡',
                    badge: 'I',
                    desc: 'Придумываем идею: жанр, механики, визуальный стиль. Решаем, что будет интересно и реально сделать за отведённое время.',
                    summary: '🎯 Придумываем крутую идею для игры: определяем жанр (платформер, квест, аркада), главного героя и основную механику — например, собирать монеты или уворачиваться от препятствий.'
                },
                {
                    id: 2,
                    title: 'Планирование и дизайн',
                    icon: '📐',
                    badge: 'II',
                    desc: 'Расписываем механику на бумаге, рисуем схемы экранов, продумываем управление и интерфейс для игрока.',
                    summary: '🗺️ Создаём карту игры: рисуем уровни, продумываем, как игрок будет управлять героем (клавиши WASD или стрелки), какие будут кнопки и очки. Всё на бумаге!'
                },
                {
                    id: 3,
                    title: 'Разработка игры',
                    icon: '⚙️',
                    badge: 'III',
                    desc: 'Пишем код на чистом JavaScript, создаём игровой цикл, спрайты через Canvas или DOM-элементы и проверяем работу механик.',
                    summary: '💻 Программируем: пишем код для движения героя, отрисовки объектов, обработки столкновений и подсчёта очков. Используем Canvas для графики — всё в одном файле!'
                },
                {
                    id: 4,
                    title: 'Ручное тестирование',
                    icon: '🧪',
                    badge: 'IV',
                    desc: 'Играем сами и даём друзьям поиграть. Ищем баги: неправильные столкновения, зависания, нелогичное поведение и исправляем.',
                    summary: '🕹️ Тестируем вручную: проходим игру разными способами, пытаемся сломать — выходим за границы, нажимаем все кнопки подряд. Записываем баги и сразу правим код.'
                },
                {
                    id: 5,
                    title: 'Релиз и презентация',
                    icon: '🚀',
                    badge: 'V',
                    desc: 'Готовим финальную версию, пишем инструкцию, делаем красивый экран «Победа» и показываем игру друзьям или одноклассникам.',
                    summary: '🏆 Выкладываем игру: создаём стартовый экран с названием, добавляем кнопку «Старт», делаем финальный счёт и делимся ссылкой. Можно даже устроить турнир!'
                }
            ];

            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            stages.forEach((stage) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = 'step';
                stepDiv.dataset.step = stage.id;

                const marker = document.createElement('div');
                marker.className = 'step-marker';
                marker.textContent = stage.badge;

                const content = document.createElement('div');
                content.className = 'step-content';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'step-title';
                titleDiv.innerHTML = `
                    <span class="step-icon">${stage.icon}</span>
                    ${stage.title}
                `;

                const descDiv = document.createElement('div');
                descDiv.className = 'step-desc';
                descDiv.textContent = stage.desc;

                const summaryDiv = document.createElement('div');
                summaryDiv.className = 'step-summary';
                summaryDiv.textContent = stage.summary;

                content.appendChild(titleDiv);
                content.appendChild(descDiv);
                content.appendChild(summaryDiv);

                stepDiv.appendChild(marker);
                stepDiv.appendChild(content);
                timeline.appendChild(stepDiv);

                stepDiv.addEventListener('click', function(e) {
                    e.stopPropagation();

                    document.querySelectorAll('.step').forEach(s => {
                        s.style.borderColor = 'rgba(255,255,255,0.04)';
                        s.style.background = 'rgba(18, 28, 50, 0.6)';
                        s.style.transform = 'scale(1) translateX(0px)';
                        const sum = s.querySelector('.step-summary');
                        if (sum) sum.classList.remove('active');
                    });

                    this.style.borderColor = '#8aa4f8';
                    this.style.background = 'rgba(40, 60, 110, 0.7)';
                    this.style.transform = 'scale(1.02) translateX(8px)';

                    const summary = this.querySelector('.step-summary');
                    if (summary) summary.classList.add('active');

                    const markerEl = this.querySelector('.step-marker');
                    if (markerEl) {
                        markerEl.style.transform = 'scale(1.2)';
                        setTimeout(() => {
                            markerEl.style.transform = '';
                        }, 300);
                    }
                });
            });

            const firstStep = document.querySelector('.step');
            if (firstStep) {
                setTimeout(() => {
                    firstStep.click();
                }, 300);
            }

            document.addEventListener('dblclick', function() {
                document.querySelectorAll('.step').forEach(s => {
                    s.style.borderColor = 'rgba(255,255,255,0.04)';
                    s.style.background = 'rgba(18, 28, 50, 0.6)';
                    s.style.transform = 'scale(1) translateX(0px)';
                    const sum = s.querySelector('.step-summary');
                    if (sum) sum.classList.remove('active');
                });
                const first = document.querySelector('.step');
                if (first) first.click();
            });
        })();
    </script>
</body>
</html>
